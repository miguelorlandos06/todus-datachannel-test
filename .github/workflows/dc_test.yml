name: ToDus DataChannel Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavdevice-dev libavfilter-dev libopus-dev libvpx-dev pkg-config libsrtp2-dev
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test
        env:
          TODUS_PHONE: ${{ secrets.TODUS_PHONE }}
          RUNTIME: "120"
        run: python datachannel_test.py
